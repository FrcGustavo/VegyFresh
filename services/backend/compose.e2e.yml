services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: identity_test
      POSTGRES_PASSWORD: identity_test
      POSTGRES_DB: identity_test
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      e2e:
        aliases:
          - identity-db

  test:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
      target: build
    working_dir: /repo/services/backend
    environment:
      NODE_ENV: test
      IDENTITY_TEST_HOST: identity-db
      IDENTITY_PROVISIONING_TEST: "true"
      IDENTITY_HTTP_TEST: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: identity_test
      POSTGRES_PASSWORD: identity_test
      POSTGRES_DB: identity_test
      OIDC_ISSUER: http://localhost/realms/vegyfresh
      OIDC_JWKS_URI: http://localhost/certs
      OIDC_API_AUDIENCE: vegyfresh-api
      OIDC_ADMIN_CLIENT_ID: vegyfresh-admin
      OIDC_PORTAL_CLIENT_ID: vegyfresh-portal
      OIDC_PROVISIONING_SECRET: e2e-only-oidc-provisioning-secret-32-bytes
    command:
      [
        "sh",
        "-c",
        "pnpm exec jest --config ./test/jest-e2e.json --runInBand --runTestsByPath test/integration/external-identity.e2e-spec.ts test/integration/identity-resolution.e2e-spec.ts && pnpm exec jest --config ./test/jest-e2e.json --runInBand --runTestsByPath test/identity-provisioning.e2e-spec.ts test/integration/microsip-import.e2e-spec.ts && pnpm exec jest --config ./test/jest-e2e.json --runInBand --runTestsByPath test/identity.e2e-spec.ts",
      ]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - e2e

networks:
  e2e:
