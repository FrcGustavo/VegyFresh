services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vegyfresh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vegyfresh-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-vegyfresh}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  migrate:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
      target: build
    working_dir: /repo/services/backend
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-vegyfresh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vegyfresh-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-vegyfresh}
    command: ["pnpm", "run", "migrations:run"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
      target: build
    working_dir: /repo/services/backend
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-vegyfresh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vegyfresh-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-vegyfresh}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_API_AUDIENCE: ${OIDC_API_AUDIENCE:-}
      OIDC_ADMIN_CLIENT_ID: ${OIDC_ADMIN_CLIENT_ID:-}
      OIDC_PORTAL_CLIENT_ID: ${OIDC_PORTAL_CLIENT_ID:-}
      OIDC_PROVISIONING_SECRET: ${OIDC_PROVISIONING_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    command: ["pnpm", "run", "dev"]
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./src:/repo/services/backend/src
    networks:
      - backend

networks:
  backend:

volumes:
  backend_postgres_data:
