services:
  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
      target: development
    working_dir: /repo
    command:
      - sh
      - -c
      - (cd /repo/clients/api-client && CI=true pnpm install --frozen-lockfile) && (cd /repo/apps/portal && CI=true pnpm install --frozen-lockfile && pnpm run dev)
    ports:
      - "${PORTAL_PORT:-5174}:5174"
    volumes:
      - ../..:/repo
      - portal_app_node_modules:/repo/apps/portal/node_modules
      - portal_api_client_node_modules:/repo/clients/api-client/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "5174"
      VEGYFRESH_API_URL: ${DEV_API_URL:-http://host.docker.internal:3000}
      VEGYFRESH_PUBLIC_ORIGIN: ${DEV_PUBLIC_ORIGIN:-http://localhost:${PORTAL_PORT:-5174}}
      VEGYFRESH_SESSION_SECRET: ${VEGYFRESH_PORTAL_SESSION_SECRET:-${VEGYFRESH_SESSION_SECRET:-}}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-}
      OIDC_CLIENT_ID: ${OIDC_PORTAL_CLIENT_ID:-${OIDC_CLIENT_ID:-}}
      OIDC_CLIENT_SECRET: ${OIDC_PORTAL_CLIENT_SECRET:-${OIDC_CLIENT_SECRET:-}}
      OIDC_API_AUDIENCE: ${OIDC_API_AUDIENCE:-}
      OIDC_API_RESOURCE_PARAMETER: ${OIDC_API_RESOURCE_PARAMETER:-audience}
      OIDC_SIGNUP_HINT: ${OIDC_SIGNUP_HINT-signup}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  portal_app_node_modules:
  portal_api_client_node_modules:
