services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      target: development
    working_dir: /repo
    command:
      - sh
      - -c
      - (cd /repo/clients/api-client && CI=true pnpm install --frozen-lockfile) && (cd /repo/apps/frontend && CI=true pnpm install --frozen-lockfile && pnpm run dev)
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../..:/repo
      - frontend_app_node_modules:/repo/apps/frontend/node_modules
      - frontend_api_client_node_modules:/repo/clients/api-client/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "5173"
      VEGYFRESH_API_URL: ${DEV_API_URL:-http://host.docker.internal:3000}
      VEGYFRESH_PUBLIC_ORIGIN: ${DEV_PUBLIC_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}
      VEGYFRESH_SESSION_SECRET: ${VEGYFRESH_ADMIN_SESSION_SECRET:-${VEGYFRESH_SESSION_SECRET:-}}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-}
      OIDC_CLIENT_ID: ${OIDC_ADMIN_CLIENT_ID:-${OIDC_CLIENT_ID:-}}
      OIDC_CLIENT_SECRET: ${OIDC_ADMIN_CLIENT_SECRET:-${OIDC_CLIENT_SECRET:-}}
      OIDC_API_AUDIENCE: ${OIDC_API_AUDIENCE:-}
      OIDC_API_RESOURCE_PARAMETER: ${OIDC_API_RESOURCE_PARAMETER:-audience}
      OIDC_SIGNUP_HINT: ${OIDC_SIGNUP_HINT-signup}
      OIDC_PROVISIONING_SECRET: ${OIDC_PROVISIONING_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  frontend_app_node_modules:
  frontend_api_client_node_modules:
