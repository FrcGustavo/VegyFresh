services:
  tools:
    build:
      context: ../..
      dockerfile: infrastructure/tooling/Dockerfile
    working_dir: /repo
    environment:
      MICROSIP_SYNC_LOCK_DIR: /microsip-locks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../..:/repo
      - frontend_dependencies:/repo/apps/frontend/node_modules
      - portal_dependencies:/repo/apps/portal/node_modules
      - backend_dependencies:/repo/services/backend/node_modules
      - api_client_dependencies:/repo/clients/api-client/node_modules
      - seed_api_dependencies:/repo/jobs/seed-api/node_modules
      - microsip_sync_dependencies:/repo/services/microsip-sync/node_modules
      - microsip_sync_locks:/microsip-locks
  image-tests:
    extends: tools
    environment:
      SMOKE_API_HOST: image-tests
      SMOKE_DOCKER_NETWORK: ${SMOKE_DOCKER_NETWORK:-vegyfresh-tools_default}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["node", "infrastructure/tooling/smoke-images.mjs"]
volumes:
  frontend_dependencies:
  portal_dependencies:
  backend_dependencies:
  api_client_dependencies:
  seed_api_dependencies:
  microsip_sync_dependencies:
  microsip_sync_locks:
    name: vegyfresh-microsip-locks
