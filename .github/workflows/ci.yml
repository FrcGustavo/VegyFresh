name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check
      - run: make contract
      - name: Verify built web server routes
        run: make test-runtime
      - name: Verify identity and tenant integration
        run: make test-e2e
      - name: Validate local identity configuration
        run: make -C infrastructure/keycloak check
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - unit: apps/frontend
            app: admin
          - unit: apps/portal
            app: portal
          - unit: services/backend
            app: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ matrix.unit }}/Dockerfile -t vegyfresh-check .
      - if: matrix.app != 'backend'
        run: make test-images APP=${{ matrix.app }} IMAGE=vegyfresh-check
      - if: matrix.app == 'backend'
        run: docker run --rm --entrypoint node vegyfresh-check -e "require('node:assert/strict').ok(require('node:fs').existsSync('dist/main.js')); require('./dist/app.module.js'); require('jwks-rsa').passportJwtSecret({ jwksUri:'http://localhost:8080/unused' });"
